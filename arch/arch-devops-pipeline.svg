al, DejaVu Sans, sans-serif'" font-size="21.875" lengthAdjust="spacing" textLength="145.9259" x="460.6172" y="3006.175">security-scan</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="21.875" lengthAdjust="spacing" textLength="888.5544" x="620.45" y="3006.175">the job in build.yml is disabled (if: false); secrets are scanned by secret-scan.yml</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="21.875" lengthAdjust="spacing" textLength="133.8028" x="460.6172" y="3031.6389">Deployment</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="21.875" lengthAdjust="spacing" textLength="2394.2444" x="620.45" y="3031.6389">Octopus Deploy deploys the release (approvals and the GitOps pin are Octopus's). The deployed runtime is drawn by the platform's health dashboard: https://blue-bush-041023510.1.azurestaticapps.net/#runtime/prod</text><line style="stroke:#000000;stroke-width:1.5625;" x1="453.6638" x2="3021.6478" y1="2934.9424" y2="2934.9424"/><line style="stroke:#000000;stroke-width:1.5625;" x1="453.6638" x2="3021.6478" y1="2960.4063" y2="2960.4063"/><line style="stroke:#000000;stroke-width:1.5625;" x1="453.6638" x2="3021.6478" y1="2985.8701" y2="2985.8701"/><line style="stroke:#000000;stroke-width:1.5625;" x1="453.6638" x2="3021.6478" y1="3011.334" y2="3011.334"/><line style="stroke:#000000;stroke-width:1.5625;" x1="453.6638" x2="3021.6478" y1="3036.7979" y2="3036.7979"/><line style="stroke:#000000;stroke-width:1.5625;" x1="453.6638" x2="453.6638" y1="2934.9424" y2="3036.7979"/><line style="stroke:#000000;stroke-width:1.5625;" x1="613.4966" x2="613.4966" y1="2934.9424" y2="3036.7979"/><line style="stroke:#000000;stroke-width:1.5625;" x1="3021.6478" x2="3021.6478" y1="2934.9424" y2="3036.7979"/></g><g class="footer" data-source-line="47"><text fill="#888888" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="15.625" lengthAdjust="