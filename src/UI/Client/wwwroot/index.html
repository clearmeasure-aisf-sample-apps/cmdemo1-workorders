<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            try {
                var k = 'churchbulletin-theme';
                var v = localStorage.getItem(k);
                var theme = (v === 'dark' || v === 'light') ? v : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) { }
        })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>.NET Conf Work Orders</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css?v=2024" rel="stylesheet" />
    <link href="css/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/app.css?v=715" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ClearMeasure.Bootcamp.UI.Client.styles.css?v=2024" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/chat.js"></script>
    <script>
        window.churchBulletinBrowserCulture = function () {
            try { return navigator.language || ""; } catch (e) { return ""; }
        };
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // Chromium under a POSIX locale (LANG=C) reports navigator.language as "en-US@posix". The .NET 11
        // WebAssembly runtime rejects that name at start-up (CultureNotSupportedException), so a locale with a
        // POSIX modifier or charset starts the app in its language tag ("en-US"); other browsers start unchanged.
        (function () {
            var options = {};
            try {
                var language = navigator.language || "";
                if (/[@.]/.test(language)) {
                    var tag = language.split(/[@.]/)[0].replace("_", "-");
                    options.applicationCulture = /^(|c|posix)$/i.test(tag) ? "en-US" : tag;
                }
            } catch (e) { }
            Blazor.start(options);
        })();
    </script>
</body>

</html>
